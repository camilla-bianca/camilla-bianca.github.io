<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Reindirizzamento...</title>
    <script type="text/javascript">
      // GitHub Pages serves this file for any URL it doesn't recognize
      // (e.g. a reload on /progetti/nome-progetto).
      // We can't run our router here, so instead we encode the requested
      // path into a query string and send the browser to index.html,
      // which does exist. A small script there will decode it back
      // into a real URL before React Router ever sees it.
      var pathSegmentsToKeep = 0; // 0 because the site lives at the domain root, not under /repo-name/

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
